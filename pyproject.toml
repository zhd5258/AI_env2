[tool.pylint]
# 禁用日志格式相关的警告
disable = [
    "logging-format-interpolation",
    "logging-fstring-interpolation", 
    "logging-not-lazy",
    "logging-format-args"
]

# 其他配置
max-line-length = 120
good-names = "i,j,k,ex,Run,_,id,db,ai,ui,io,os,sys,re,df,dt,ts,url,api,id,pk,obj,cls,self,args,kwargs"

[tool.flake8]
max-line-length = 120
extend-ignore = [
    "E203",  # whitespace before ':'
    "E501",  # line too long
    "W503",  # line break before binary operator
    "F401",  # imported but unused
    "F841",  # local variable assigned but never used
]
exclude = [
    "venv",
    "__pycache__",
    ".git",
    ".pytest_cache",
    "temp_word"
]

[tool.pyright]
# 禁用日志格式相关的类型检查
reportGeneralTypeIssues = false
reportOptionalMemberAccess = false
reportOptionalSubscript = false
reportPrivateImportUsage = false

# 其他配置
pythonVersion = "3.10"
include = ["."]
exclude = ["venv", "__pycache__", ".git", ".pytest_cache", "temp_word"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
