<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI智能投标文件评价系统</title>
    <!-- 引入 Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- 引入 Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- 引入自定义CSS -->
    <link href="/static/css/style.css" rel="stylesheet">
    <!-- 加载 Chart.js -->
</head>
<body>
    <div class="container">
        <div class="header d-flex justify-content-between align-items-start">
            <div>
                <h1><i class="fas fa-file-contract me-2"></i>AI智能投标文件评价系统</h1>
                <p class="lead">基于人工智能技术，自动分析和评估投标文件，提升评标效率和准确性</p>
            </div>
            <div class="mt-2">
                <button class="btn btn-outline-secondary" id="btnOpenSettings">
                    <i class="fas fa-sliders-h me-1"></i>系统设置
                </button>
                <button class="btn btn-outline-primary ms-2" id="btnHistory">
                    <i class="fas fa-history me-1"></i>历史项目
                </button>
            </div>
        </div>
        
        <div class="upload-section">
            <form id="uploadForm">
                <div class="mb-4">
                    <label for="tenderFile" class="form-label">
                        <i class="fas fa-file-pdf me-2 text-danger"></i>选择招标文件
                    </label>
                    <input type="file" class="form-control" id="tenderFile" accept=".pdf,.doc,.docx">
                </div>
                
                <div class="mb-4">
                    <label for="bidFiles" class="form-label">
                        <i class="fas fa-file-invoice me-2 text-info"></i>选择投标文件（可多选）
                    </label>
                    <input type="file" class="form-control" id="bidFiles" multiple accept=".pdf,.doc,.docx">
                </div>
                
                <div id="fileList" class="file-list mb-4">
                    <!-- 文件列表将在这里显示 -->
                    <div class="text-muted">尚未选择任何文件</div>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-primary btn-lg">
                        <i class="fas fa-cogs me-2"></i>开始智能分析
                    </button>
                </div>
            </form>
        </div>

        <div class="progress-container" id="progressContainer" style="display: none;">
            <h3 class="mb-4"><i class="fas fa-spinner me-2"></i>分析进度</h3>
            <div class="progress mb-3">
                <div class="progress-bar progress-bar-striped progress-bar-animated" 
                     role="progressbar" 
                     id="progressBar"
                     style="width: 0%">
                </div>
            </div>
            <div id="progressText" class="text-center fw-bold mb-4"></div>

            <div id="detailedProgress">
                <!-- Detailed progress will be shown here -->
            </div>
        </div>

        <div id="resultArea" class="result-section">
            <!-- 分析结果将在这里显示 -->
        </div>

        <!-- 结果详情模态框 -->
        <div class="modal fade" id="resultDetailsModal" tabindex="-1" aria-labelledby="resultDetailsModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-xl modal-dialog-scrollable">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="resultDetailsModalLabel">详细分析</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body" id="modalBody">
                        <!-- Section for Price Chart -->
                        <div class="mb-5">
                            <h4><i class="fas fa-dollar-sign me-2"></i>价格与价格分对比</h4>
                            <div style="height: 400px;">
                                <canvas id="priceChart"></canvas>
                            </div>
                        </div>
                        
                        <hr>

                        <!-- Section for Detailed Scores Table -->
                        <div>
                            <h4><i class="fas fa-list me-2"></i>详细评分表</h4>
                            <div class="table-responsive" id="detailedScoresTable">
                                <!-- Detailed scores table will be inserted here -->
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 系统设置模态框 -->
        <div class="modal fade" id="settingsModal" tabindex="-1" aria-labelledby="settingsModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="settingsModalLabel">系统设置</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <form id="settingsForm">
                            <div class="mb-3">
                                <label for="pdfPageMaxWorkers" class="form-label">PDF页面处理最大并发数</label>
                                <input type="number" class="form-control" id="pdfPageMaxWorkers" min="1" max="32">
                                <div class="form-text">建议值: 4-8 (根据CPU核心数调整)</div>
                            </div>
                            <div class="mb-3">
                                <label for="pdfPageTimeoutSec" class="form-label">单页PDF处理超时(秒)</label>
                                <input type="number" class="form-control" id="pdfPageTimeoutSec" min="5" max="300">
                                <div class="form-text">建议值: 60-120</div>
                            </div>
                            <div class="mb-3">
                                <label for="pdfOverallMinTimeoutSec" class="form-label">整体PDF处理最小超时(秒)</label>
                                <input type="number" class="form-control" id="pdfOverallMinTimeoutSec" min="30" max="3600">
                                <div class="form-text">建议值: 180-600</div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">OCR配置</label>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="useGpu">
                                    <label class="form-check-label" for="useGpu">
                                        启用GPU加速 (需要支持CUDA的显卡)
                                    </label>
                                </div>
                            </div>
                            <div id="cfg_feedback" class="form-text text-success"></div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                        <button type="button" class="btn btn-primary" id="saveSettings">保存设置</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 引入 Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- 引入 Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- 引入自定义 JS -->
    <script src="/static/js/main.js"></script>
    <script src="/static/js/app.js"></script>
    <script>
        // 页面加载完成后添加按钮事件监听
        document.addEventListener('DOMContentLoaded', function() {
            // 系统设置按钮事件
            const btnOpenSettings = document.getElementById('btnOpenSettings');
            if (btnOpenSettings) {
                btnOpenSettings.addEventListener('click', function() {
                    // 触发app.js中的设置功能
                    if (typeof loadRuntimeConfig === 'function') {
                        loadRuntimeConfig().then(() => {
                            const modalElement = document.getElementById('settingsModal');
                            if (modalElement) {
                                const modal = new bootstrap.Modal(modalElement);
                                modal.show();
                            }
                        });
                    }
                });
            }
            
            // 历史项目按钮事件
            const btnHistory = document.getElementById('btnHistory');
            if (btnHistory) {
                btnHistory.addEventListener('click', function() {
                    window.location.href = '/history';
                });
            }
        });
    </script>
</body>
</html>
