<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能评标系统</title>
    <!-- 将CDN引用改为本地引用 -->
    <link href="/static/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/all.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
    <link href="/static/css/index.css" rel="stylesheet">
</head>
<body>
    <!-- 导航栏 -->
    <div class="navbar">
        <ul>
            <li><a href="/" class="active"><i class="fas fa-home me-1"></i>首页</a></li>
            <li><a href="/history"><i class="fas fa-history me-1"></i>历史项目</a></li>
            <li><a href="/settings"><i class="fas fa-cog me-1"></i>系统设置</a></li>
        </ul>
    </div>
    
    <h1>智能评标系统</h1>
    
    <div class="upload-section">
        <form id="uploadForm" method="POST" enctype="multipart/form-data">
            <div class="form-group">
                <label for="tender_file">招标文件:</label>
                <input type="file" id="tender_file" name="tender_file" accept=".pdf,.doc,.docx" required>
            </div>
            
            <div class="form-group">
                <label for="bid_files">投标文件 (可多选):</label>
                <input type="file" id="bid_files" name="bid_files" multiple accept=".pdf,.doc,.docx" required>
            </div>
            
            <button type="submit">上传文件</button>
        </form>
    </div>
    
    <!-- 文件列表显示区域 -->
    <div id="fileListSection" class="file-list-section">
        <h3>已选择的文件</h3>
        <div id="fileList"></div>
    </div>
    
    <!-- 进度显示区域 -->
    <div id="progressSection" class="progress-section container-fluid" style="display: none;">
        <h3 class="mb-3"><i class="fas fa-tachometer-alt me-2"></i>处理进度</h3>
        <div class="card mb-3">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <p class="mb-0 fw-bold">项目ID: <span id="projectId" class="text-primary">-</span></p>
                    <p class="mb-0"><span class="badge bg-info" id="progressStatus">准备中</span></p>
                </div>
                <div class="progress-bar-container" style="width: 100%;">
                    <div class="progress-bar" style="width: 100%;">
                        <div class="progress-fill" id="progressFill" style="width: 0%;"></div>
                    </div>
                </div>
                <p id="progressText" class="mt-2 mb-0 text-muted">准备中...</p>
            </div>
        </div>
        <div id="detailedProgress" class="container-fluid"></div>
        <!-- 用时显示区域 -->
        <div id="timeDisplay" class="time-display processing">
            <i class="fas fa-clock me-1"></i>已用时: <span id="elapsedTime">0</span> 秒
        </div>
        <!-- 符合性审查按钮 -->
        <div id="complianceReviewBtn" class="compliance-btn">
            <a href="#" class="btn btn-info" id="complianceReviewLink">
                <i class="fas fa-clipboard-check me-1"></i>查看符合性审查表
            </a>
        </div>
    </div>
    
    <!-- 结果显示区域 -->
    <div id="result" class="result"></div>

    <!-- 引入JavaScript文件 -->
    <script src="/static/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/main.js"></script>
</body>
</html>
