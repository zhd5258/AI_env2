<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>历史评标项目 - AI智能投标文件评价系统</title>
    <!-- 将CDN引用改为本地引用 -->
    <link href="/static/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/history.css">
</head>
<body>
    <div class="container-fluid">
        <!-- 导航栏 -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
            <div class="container-fluid">
                <a class="navbar-brand" href="/">
                    <i class="fas fa-file-contract me-2"></i>AI智能投标文件评价系统
                </a>
                <div class="navbar-nav ms-auto">
                    <a class="nav-link" href="/">首页</a>
                    <a class="nav-link active" href="/history">历史项目</a>
                </div>
            </div>
        </nav>

        <!-- 主要内容 -->
        <div class="container mt-4">
            <div class="row">
                <div class="col-12">
                    <h2 class="mb-4">
                        <i class="fas fa-history me-2"></i>历史评标项目
                    </h2>
                    
                    <!-- 项目列表 -->
                    <div class="card">
                        <div class="card-header">
                            <h5 class="mb-0">
                                <i class="fas fa-list me-2"></i>项目列表
                            </h5>
                        </div>
                        <div class="card-body">
                            <!-- 加载指示器 -->
                            <div id="loadingIndicator" class="text-center my-4" style="display: none;">
                                <div class="spinner-border" role="status">
                                    <span class="visually-hidden">加载中...</span>
                                </div>
                                <p class="mt-2">正在加载项目列表...</p>
                            </div>
                            
                            <!-- 错误消息 -->
                            <div id="errorMessage" class="alert alert-danger d-none" role="alert">
                                <h5><i class="fas fa-exclamation-triangle me-2"></i>错误</h5>
                                <p id="errorText"></p>
                                <button type="button" class="btn btn-primary" onclick="location.reload()">
                                    <i class="fas fa-sync-alt me-1"></i>重新加载
                                </button>
                            </div>
                            
                            <div class="table-responsive">
                                <table class="table table-hover">
                                    <thead class="table-dark">
                                        <tr>
                                            <th>项目编号</th>
                                            <th>项目名称</th>
                                            <th>描述</th>
                                            <th>创建时间</th>
                                            <th>状态</th>
                                            <th>投标文件数</th>
                                            <th>结果数</th>
                                            <th>操作</th>
                                        </tr>
                                    </thead>
                                    <tbody id="projectsTableBody">
                                        <tr>
                                            <td colspan="8" class="text-center">
                                                <div class="spinner-border" role="status">
                                                    <span class="visually-hidden">加载中...</span>
                                                </div>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                            
                            <!-- 分页控件 -->
                            <div id="paginationControls" class="mt-3">
                                <!-- 分页控件将通过JavaScript动态生成 -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 项目详情模态框 -->
        <div class="modal fade" id="projectDetailsModal" tabindex="-1" aria-labelledby="projectDetailsModalLabel">
            <div class="modal-dialog modal-xl modal-dialog-scrollable">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="projectDetailsModalLabel">
                            <i class="fas fa-info-circle me-2"></i>项目详情
                        </h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body" id="projectDetailsModalBody">
                        <!-- 项目详情内容将通过JavaScript动态加载 -->
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                            <i class="fas fa-times me-1"></i>关闭
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 引入 Bootstrap JS -->
    <!-- 将CDN引用改为本地引用 -->
    <script src="/static/js/bootstrap.bundle.min.js"></script>
    <!-- 引入 Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- 引入自定义 JS -->
    <script src="/static/js/history.js"></script>
</body>
</html>
