[pylint]
# 禁用日志格式相关的警告
disable=
    logging-format-interpolation,
    logging-fstring-interpolation,
    logging-not-lazy,
    logging-format-args

# 其他常用配置
max-line-length=120
indent-string='    '
good-names=i,j,k,ex,Run,_,id,db,ai,ui,io,os,sys,re,df,dt,ts,url,api,id,pk,obj,cls,self,args,kwargs

# 忽略的文件和目录
ignore-paths=venv/|__pycache__/|\.git/|\.pytest_cache/|temp_word/

# 消息格式
msg-template={path}:{line}:{column}: {msg_id}: {msg} ({symbol})

[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

[flake8]
max-line-length = 120
extend-ignore = 
    E203,  # whitespace before ':'
    E501,  # line too long
    W503,  # line break before binary operator
    F401,  # imported but unused
    F841,  # local variable assigned but never used
exclude = 
    venv,
    __pycache__,
    .git,
    .pytest_cache,
    temp_word
